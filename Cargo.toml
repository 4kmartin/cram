[package]
name = "cram"
version = "0.1.0"
edition = "2024"

[features]
configuration = ["dep:toml", "dep:serde"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"], optional = true }
toml = { version = "1.1.2", optional = true }
